id: extensions
title: Extensions
# Chrome extensions built by supervisors, one repository each. The extension's files sit at the top of the repository
# (no build step, no app folder), and it arrives in a pull request from a builder's branch.
repos:
  - Moxie-Pest-Control-Phoenix/scheduling-tool-suite
  - Moxie-Pest-Control-Phoenix/termites-tool-suite
  - Moxie-Pest-Control-Phoenix/moxie-click-to-dial
  - Moxie-Pest-Control-Phoenix/isales-audit-tool
  - Moxie-Pest-Control-Phoenix/TI-route-snapshot
stageRules:
  - { default: true, stage: other }

# No standards are listed here: the tech team's extension review kit is downloaded at review time (gh reads only),
# cached by commit and ref, and its files are attached to this pack as standards, in this order. calibration.md holds
# dated entries: the hold-out and the challenger read it entry by entry. lenses.md holds the team's own rules for each of
# its four lenses (what blocks a pull request, what is asked about), so Airlock's lenses are held to the team's bar, not
# a weaker one; its notes on the extension's place in the portfolio and on updating register.md are the kit owner's to
# act on, and each brief says they are not a lens's job. Left out: lens-rules.md, which instructs the kit's own agents
# (their tools, files and reply) that Airlock's lenses do not use, and SKILL.md and asks.md, which are about running the
# kit's review and writing its comments. The attached files also name profile.md and extensions.md, which are not
# attached either. Each brief says that a file of one of those names in the working folder belongs to the pull request.
kit:
  repo: Moxie-Pest-Control-Phoenix/moxie-ext-review-kit
  files:
    - skills/ext-review/standard.md
    - skills/ext-review/conventions.md
    - skills/ext-review/calibration.md
    - skills/ext-review/register.md
    - skills/ext-review/fieldroutes.md
    - skills/ext-review/lenses.md
  datedStandards:
    - skills/ext-review/calibration.md

# Read: the manifest, the background and content scripts, configuration, and whatever sends data out (Apps Script
# receivers, files that wrap fetch or a Google or CRM call), at the top or one folder down (a feature such as
# route-monitor/ may carry its own), and the setup notes beside the receivers (every .md under an apps-script/ folder,
# and every .md whose name holds "setup" in any letter case), where a token or a receiver's address can be pasted. On top
# of these, every changed file the extension loads is read whatever its path, test, fixture and ignored folders
# included: what the manifest names, the local scripts its pages pull in, and what those scripts load in turn (the
# extension-loaded-files check names them).
# Skimmed (the default): the popup, options and side panel pages, their scripts and the styles; and a changed script or
# page that a built-in rule would leave out as minified, built or generated, since here a person commits it and Chrome may
# load it (the extension-loaded-files check names them).
# Trusted: the top-level tests/ folder with the fixtures under it (and the engine's built-in test names), the other words
# for people (README, CHANGELOG, privacy notes), and the image files under icons/. If manifest.json cannot be read at the
# head, no code file is trusted (the extension-loaded-files check names them), since what the extension loads is not known.
tiers:
  read:
    - "manifest.json"
    - "!(tests)/manifest.json"
    - "{background,service-worker,sw}*.{js,mjs,cjs}"
    - "!(tests)/{background,service-worker,sw}*.{js,mjs,cjs}"
    - "*content*.{js,mjs,cjs}"
    - "!(tests)/*content*.{js,mjs,cjs}"
    - "{config,settings,destinations}*.{js,mjs,cjs}"
    - "!(tests)/{config,settings,destinations}*.{js,mjs,cjs}"
    - "*{api,fetch,http,request,network,sync,send,deliver,receiver,bridge,coordination,telemetry,upload,queue}*.{js,mjs,cjs}"
    - "!(tests)/*{api,fetch,http,request,network,sync,send,deliver,receiver,bridge,coordination,telemetry,upload,queue}*.{js,mjs,cjs}"
    - "**/*.gs"
    - "**/apps-script/**/*.md"
    - "**/*[sS][eE][tT][uU][pP]*.md"
    - ".github/**"
    - "trufflehog-exclude.txt"
  trust:
    - "tests/**"
    - "**/*.md"
    - "icons/**/*.{png,jpg,jpeg,gif,ico,webp}"

codeChecks:
  - extension-permissions
  - extension-broad-hosts
  - extension-version-changelog
  - extension-remote-code
  - extension-html-injection
  - extension-large-files
  - extension-loaded-files

lenses:
  - { id: security, title: Security, file: lenses/security.md }
  - { id: data, title: Data, file: lenses/data.md }
  - { id: office, title: Office, file: lenses/office.md }
  - { id: quality, title: Quality, file: lenses/quality.md }
